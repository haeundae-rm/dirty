<style>
:root{
  --bg:#F3F5F8; --surface:#FFFFFF; --ink:#16202C; --muted:#5E6B7A; --line:#D9DFE7;
  --done:#2E7D4F; --done-soft:#E2F2E8; --over:#B8650A; --over-soft:#FBEEDD; --navy:#10233F; --warn:#B23A48;
  --f-body:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --f-num:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (rm-light-only){:root{
  --bg:#0E141C; --surface:#17202B; --ink:#E8EDF3; --muted:#9AA7B6; --line:#2A3644;
  --done:#5CC28A; --done-soft:#173326; --over:#E9A04B; --over-soft:#3A2A14; --navy:#0A1830; --warn:#F07A88; color-scheme:dark}}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45}
button{font-family:inherit}
.top{position:sticky;top:0;z-index:5;background:var(--navy);color:#fff;padding:12px 16px 10px}
.top-row{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
.top h1{margin:0;font-size:17px;font-weight:900}
.top .date{font-size:13px;opacity:.8}
.overall{margin-top:8px;display:flex;align-items:center;gap:10px;font-size:13px}
.bar{flex:1;height:8px;border-radius:99px;background:rgba(255,255,255,.18);overflow:hidden}
.bar>i{display:block;height:100%;background:#7BE0A6;width:0;transition:width .4s}
.overall b{font-family:var(--f-num);font-variant-numeric:tabular-nums}
.tabs{display:flex;gap:6px;margin-top:10px;overflow-x:auto;padding-bottom:2px}
.tab{flex:0 0 auto;border:1px solid rgba(255,255,255,.28);background:transparent;color:#fff;border-radius:99px;padding:7px 14px;font:700 14px var(--f-body);cursor:pointer}
.tab[aria-selected="true"]{background:#fff;color:var(--navy);border-color:#fff}
.tab .dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;vertical-align:1px}
.sync{font-size:11px;opacity:.75;margin-top:6px;min-height:15px}
main{padding:16px 16px 48px;max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
.notice{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;color:var(--muted);font-size:14px}
.notice strong{color:var(--ink)}

/* 근무자 요약 */
.sum{background:var(--surface);border:1px solid var(--line);border-left:6px solid var(--wc);border-radius:14px;padding:14px 16px}
.sum .who{font-size:15px;font-weight:700;color:var(--muted)}
.sum .who b{color:var(--ink);font-size:18px;font-weight:900}
.sum .left{display:flex;align-items:baseline;gap:8px;margin-top:4px;flex-wrap:wrap}
.sum .left .n{font:600 40px/1 var(--f-num);color:var(--wc)}
.sum .left .u{font-size:16px;font-weight:700}
.sum .left .of{margin-left:auto;font:600 14px var(--f-num);color:var(--muted)}
.sum.alldone .left .n{color:var(--done)}
.meter{height:8px;border-radius:99px;background:var(--line);overflow:hidden;margin-top:10px}
.meter>i{display:block;height:100%;width:0;transition:width .4s;background:var(--wc)}
.sum p{margin:8px 0 0;font-size:12px;color:var(--muted)}
.handed{background:var(--surface);border:1px dashed var(--line);border-radius:12px;padding:10px 14px;font-size:13px;color:var(--muted)}
.handed div+div{margin-top:4px}

/* 메이드 카드 */
.maid{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.maid-head{display:flex;align-items:center;gap:8px;padding:12px 14px 8px;border-left:6px solid var(--wc);flex-wrap:wrap}
.maid-head .nm{font-size:18px;font-weight:900}
.floor{font-size:13px;font-weight:700;color:var(--wc);background:color-mix(in srgb,var(--wc) 12%,transparent);padding:2px 8px;border-radius:6px}
.badge{font:700 11px var(--f-body);color:#fff;background:var(--wc);padding:2px 7px;border-radius:99px}
.stat{margin-left:auto;text-align:right;line-height:1.15}
.stat .big{display:block;font:700 22px var(--f-num);color:var(--wc)}
.stat .big small{font:700 14px var(--f-body);margin-left:2px}
.maid.idle .stat .big{color:var(--muted)}
.maid.full .stat .big{color:var(--done)}
.maid.over .stat .big{color:var(--over)}
.stat .qty{margin-top:3px;border:1px dashed var(--line);background:transparent;color:var(--muted);border-radius:8px;padding:2px 8px;font:600 12px var(--f-num);cursor:pointer}
.pbar{height:5px;background:var(--line);margin:0 14px 10px 20px;border-radius:99px;overflow:hidden}
.pbar>i{display:block;height:100%;background:var(--wc);transition:width .4s}
.maid.full .pbar>i{background:var(--done)}
.maid.over .pbar>i{background:var(--over)}
.rooms{display:grid;grid-template-columns:repeat(auto-fill,minmax(76px,1fr));gap:8px;padding:2px 14px 12px}
.room{position:relative;min-height:54px;border-radius:10px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);font:600 18px var(--f-num);cursor:pointer;touch-action:manipulation;padding:4px 2px}
.room small{display:block;font:500 10px var(--f-body);color:var(--muted);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.room.on{background:var(--done-soft);border-color:var(--done);color:var(--done)}
.room.on small{color:var(--done)}
.room.on::after{content:"✓";position:absolute;top:3px;right:6px;font-size:12px}
.room.other.on{border-style:dotted}
.room.new{border-style:dashed}
.maid-foot{display:flex;gap:8px;align-items:center;padding:0 14px 12px;flex-wrap:wrap}
.hint{font-size:12px;color:var(--muted);margin:0;flex:1;min-width:160px}
.ghost{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:99px;padding:6px 12px;font:700 13px var(--f-body);cursor:pointer}
.ghost:disabled,.take:disabled{opacity:.5;cursor:default}
.fold{display:flex;align-items:center;gap:8px;width:100%;padding:12px 14px;border:0;border-left:6px solid var(--done);background:var(--done-soft);color:var(--done);font:700 15px var(--f-body);cursor:pointer;text-align:left;flex-wrap:wrap}
.fold .nm{font-weight:900;color:var(--ink)}
.fold .r{margin-left:auto;font:600 14px var(--f-num)}
.maid.over .fold{border-left-color:var(--over);background:var(--over-soft);color:var(--over)}
.unfold{border:0;background:transparent;color:var(--muted);font:700 12px var(--f-body);cursor:pointer;padding:2px 4px}

/* 목록 (넘겨받기 / 지원 없음) */
.pool{background:var(--surface);border:1px dashed var(--line);border-radius:14px;overflow:hidden}
.pool summary{list-style:none;cursor:pointer;padding:14px 36px 14px 14px;position:relative;font-weight:900;font-size:16px}
.pool summary::-webkit-details-marker{display:none}
.pool summary span{display:block;font-weight:500;color:var(--muted);font-size:13px;margin-top:2px}
.pool summary::after{content:"▾";position:absolute;right:14px;top:16px;color:var(--muted)}
.pool[open] summary::after{content:"▴"}
.prow{display:flex;gap:10px;align-items:center;padding:10px 14px;border-top:1px solid var(--line)}
.prow .who{flex:1;min-width:0}
.prow .who b{font-size:15px}
.prow .who .floor{--wc:var(--muted);margin-left:6px}
.prow .who p{margin:3px 0 0;font:500 12px var(--f-num);color:var(--muted);overflow-wrap:anywhere}
.prow .owner{font-size:12px;color:var(--muted)}
.take{border:0;background:var(--navy);color:#fff;border-radius:10px;padding:9px 12px;font:700 13px var(--f-body);cursor:pointer;flex:0 0 auto}

/* 관리자 */
.greet h2{margin:0;font-size:20px;font-weight:900}
.greet p{margin:2px 0 0;color:var(--muted);font-size:13px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px;display:flex;flex-direction:column;gap:6px}
.kpi .line{font-size:15px}
.kpi .line b{font-family:var(--f-num)}
.kpi .tip{font-size:13px;color:var(--muted)}
.addw{align-self:flex-start;border:0;background:var(--navy);color:#fff;border-radius:12px;padding:12px 16px;font:700 15px var(--f-body);cursor:pointer}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px}
.card h3{margin:0 0 2px;font-size:16px;font-weight:900;display:flex;align-items:center;gap:8px}
.card h3 i{width:10px;height:10px;border-radius:50%;display:inline-block}
.card .big{font:600 26px var(--f-num)}
.card .big small{font-size:13px;color:var(--muted);font-family:var(--f-body);font-weight:500}
.rows{display:flex;flex-direction:column;gap:6px;font-size:13px;margin-top:10px}
.rows div{display:flex;justify-content:space-between;gap:8px}
.rows span:last-child{font-family:var(--f-num);color:var(--muted);white-space:nowrap}
.rows .ok span:last-child{color:var(--done);font-weight:600}
.rows .ov span:last-child{color:var(--over);font-weight:600}
.rows small{color:var(--muted)}
.card .end{margin-top:12px}
.ended{font-size:13px;color:var(--muted)}
.feed{list-style:none;margin:0;padding:0}
.feed li{display:flex;gap:10px;padding:8px 0;border-top:1px solid var(--line);font-size:13px}
.feed li:first-child{border-top:0}
.feed time{font-family:var(--f-num);color:var(--muted);flex:0 0 44px}
.feed span{overflow-wrap:anywhere}
.sec{font-size:13px;font-weight:700;color:var(--muted);margin:4px 0 -4px}

/* 창 */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.panel{background:var(--surface);color:var(--ink);width:100%;max-width:520px;max-height:88vh;overflow:auto;border-radius:18px 18px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:14px}
.panel h3{margin:0;font-size:18px;font-weight:900}
.panel p{margin:0;color:var(--muted);font-size:13px}
.panel label{font-size:13px;font-weight:700}
.step{display:flex;align-items:center;gap:12px}
.step button{width:48px;height:48px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:700 22px var(--f-num);cursor:pointer}
.panel input[type=text],.panel input[type=number],.panel input[type=password],.panel input:not([type]),.panel select{width:100%;font:500 17px var(--f-body);padding:12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
.qtyin::-webkit-outer-spin-button,.qtyin::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.qtyin{-moz-appearance:textfield;appearance:textfield;width:90px !important;text-align:center;font:600 26px var(--f-num) !important;padding:8px !important}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1.5px dashed var(--line);background:var(--bg);color:var(--ink);border-radius:10px;padding:8px 12px;font:600 16px var(--f-num);cursor:pointer}
.chip b{color:var(--warn);margin-left:4px}
.plan{border:1px solid var(--line);border-radius:12px;overflow:hidden}
.plan>div{padding:10px 12px;border-top:1px solid var(--line);font-size:14px}
.plan>div:first-child{border-top:0}
.plan b{font-weight:900}
.plan .mv{color:var(--muted);font-size:13px;margin-top:2px}
.opt{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border:1px solid var(--line);border-radius:12px;cursor:pointer}
.opt input{margin-top:3px}
.opt.on{border-color:var(--navy);box-shadow:0 0 0 1px var(--navy) inset}
.acts{display:flex;gap:8px}
.acts button{flex:1;min-height:48px;border-radius:12px;font:700 15px var(--f-body);cursor:pointer;border:1px solid var(--line);background:var(--surface);color:var(--ink)}
.acts .go{background:var(--navy);color:#fff;border-color:var(--navy)}
.acts .go:disabled{background:var(--line);border-color:var(--line);color:var(--muted);cursor:default}
.acts .danger{background:var(--warn);border-color:var(--warn);color:#fff}
.err{color:var(--warn) !important;font-weight:700}
.pick{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px 16px;display:flex;flex-direction:column;gap:12px}
.pick h2{margin:0;font-size:20px;font-weight:900}
.pick p{margin:0;color:var(--muted);font-size:13px}
.names{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
.names button{display:flex;align-items:center;gap:8px;min-height:56px;padding:10px 14px;border-radius:12px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);font:900 18px var(--f-body);cursor:pointer}
.names i{width:12px;height:12px;border-radius:50%;flex:0 0 auto}
.adminin{align-self:flex-start;border:0;background:transparent;color:var(--muted);font:700 13px var(--f-body);text-decoration:underline;cursor:pointer;padding:4px 0}
.mebar{display:flex;align-items:center;gap:8px;margin-top:10px}
.mechip{border-radius:99px;padding:7px 14px;font:700 14px var(--f-body);background:#fff;color:var(--navy)}
.mechip .dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;vertical-align:1px}
.rename{border:1px solid rgba(255,255,255,.35);background:transparent;color:#fff;border-radius:99px;padding:6px 12px;font:700 12px var(--f-body);cursor:pointer}
.amode{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--muted)}
.amode b{color:var(--ink)}
.pinin{letter-spacing:10px;text-align:center;font:600 28px var(--f-num) !important;width:180px !important}
/* 출퇴근 */
.att{background:var(--surface);border:1.5px solid var(--line);border-radius:14px;padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.att .h{font-size:16px;font-weight:900}
.att .h small{display:block;font-size:13px;font-weight:500;color:var(--muted);margin-top:2px}
.att.on{border-color:var(--done)}
.att.off{border-style:dashed}
.att .now{font-size:15px}
.att .now b{font-weight:900}
.att .row{display:flex;gap:8px;flex-wrap:wrap}
.attbtn{flex:1;min-height:56px;border:0;border-radius:14px;font:900 18px var(--f-body);cursor:pointer;color:#fff;background:var(--navy)}
.attbtn.in{background:var(--done)}
.attbtn.out{background:var(--warn)}
.attbtn.sub{flex:0 0 auto;background:var(--surface);color:var(--ink);border:1.5px solid var(--line);font-size:15px;padding:0 16px}
.tasks{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.taskb{min-height:76px;border:2px solid var(--line);border-radius:14px;background:var(--bg);color:var(--ink);font:900 18px var(--f-body);cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.taskb small{font:500 12px var(--f-body);color:var(--muted)}
.taskb.on{border-color:var(--navy);box-shadow:0 0 0 2px var(--navy) inset;background:var(--surface)}
.mywork{border:1px solid rgba(255,255,255,.35);background:#fff;color:var(--navy);border-radius:99px;padding:6px 12px;font:800 12px var(--f-body);cursor:pointer}
.mlist{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.mlist div{display:flex;justify-content:space-between;gap:10px;padding:10px 12px;border-top:1px solid var(--line);font-size:14px}
.mlist div:first-child{border-top:0}
.mlist b{font-family:var(--f-num)}
.mlist small{display:block;color:var(--muted);font-size:12px}
.mtop{display:flex;align-items:center;gap:8px}
.mtop button{border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:10px;width:44px;height:40px;font:800 18px var(--f-body);cursor:pointer}
.mtop h3{flex:1;text-align:center}
.msum{display:flex;gap:10px}
.msum div{flex:1;background:var(--bg);border-radius:12px;padding:10px;text-align:center}
.msum b{display:block;font:700 26px var(--f-num)}
.msum span{font-size:12px;color:var(--muted)}
.attrow{display:flex;align-items:center;gap:8px}
.attrow>span:first-child{flex:1;min-width:0}
.attrow .miss{color:var(--warn);font-weight:700}
.timein{width:130px !important;font:600 20px var(--f-num) !important}
.thanks{position:fixed;inset:0;z-index:38;display:flex;align-items:center;justify-content:center;pointer-events:none}
.thanks div{background:var(--done);color:#fff;font:900 22px var(--f-body);padding:22px 28px;border-radius:20px;box-shadow:0 12px 32px rgba(0,0,0,.3);text-align:center;animation:thx 3s ease forwards}
.thanks small{display:block;font:600 14px var(--f-body);opacity:.9;margin-top:6px}
@keyframes thx{0%{opacity:0;transform:scale(.7)}12%{opacity:1;transform:scale(1.05)}20%{transform:scale(1)}85%{opacity:1}100%{opacity:0}}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:39;overflow:hidden}
.confetti i{position:absolute;top:-12px;width:9px;height:14px;border-radius:2px;animation:fall 1.7s ease-in forwards}
@keyframes fall{to{transform:translateY(105vh) rotate(540deg);opacity:.9}}
@media (prefers-reduced-motion:reduce){.confetti{display:none}.thanks div{animation:none}}
@media (rm-light-only){.stat .big,.sum .left .n,.floor{color:color-mix(in srgb,var(--wc) 55%,#fff)}}
</style>

<body>
<header class="top">
  <div class="top-row"><h1>정비 지원</h1><span class="date" id="date">불러오는 중</span></div>
  <div class="overall"><span>전체</span><div class="bar"><i id="allBar"></i></div><b id="allTxt">0 / 0</b></div>
  <nav class="tabs" id="tabs"></nav>
  <div class="sync" id="sync"></div>
</header>
<main id="main"><div class="notice"><strong>오늘 배정을 불러오고 있어요.</strong></div></main>
<div id="sheet"></div>
<script src="server.js?v=2026.11.12-1"></script>
<script src="act.js?v=2026.11.12-1"></script>
<script src="shim.js?v=2026.11.12-1"></script>
<script>
var plan = null, checks = {}, tab = null, dlg = null, busyChg = false, pver = 0;  // pver: 담당 변경 횟수. 변경 전에 출발한 응답의 담당 정보는 버림
var openCards = {}, openSecs = {};
var me = null, adminTok = null;   // me: 이 휴대폰의 근무자 이름 (한 번 고르면 고정), adminTok: 관리자 비밀번호 확인값
function lsGet(k){ try { return localStorage.getItem(k); } catch (e) { return null; } }
function lsSet(k, v){ try { if (v === null) localStorage.removeItem(k); else localStorage.setItem(k, v); } catch (e) {} }
tab = lsGet('dust_tab'); me = lsGet('dust_me'); adminTok = lsGet('dust_admin');

// ---------- 기본 도구
function $(s){ return document.querySelector(s); }
function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function hm(iso){ var d = new Date(iso); return isNaN(d) ? '' : ('0'+d.getHours()).slice(-2)+':'+('0'+d.getMinutes()).slice(-2); }
function cleanName(v){ return String(v || '').replace(/\s+/g, ' ').trim().slice(0, 20); }
function active(){ return plan.workers.filter(function(w){ return !w.ended; }); }
// 더티를 하는 정비보조 (기타 업무 중이고 담당 메이드가 없는 사람은 빼고) — 나누기·근무 종료·관리자 카드 기준
function isEtc(w){ var a = plan.att && plan.att[w.name] || {}; return !w.maids.length && (a.task === '기타 업무' || (!a.task && (w.etc || w.walkin))); }
function dActive(){ return active().filter(function(w){ return !isEtc(w); }); }
function workerOf(n){ return plan.workers.filter(function(w){ return w.name === n; })[0] || null; }
function attOf(n){ return plan && plan.att && plan.att[n] || null; }
function known(n){ return !!plan && ((plan.known || []).indexOf(n) >= 0 || !!workerOf(n)); }
function taskLab(t){ return t === '더티' ? '🛏 더티' : t ? '🧰 ' + t : '-'; }
function nowHM(){ var d = new Date(); return ('0'+d.getHours()).slice(-2)+':'+('0'+d.getMinutes()).slice(-2); }
function confetti(){
  var box = document.createElement('div'); box.className = 'confetti';
  var cols = ['#1E8E3E', '#D93025', '#E8710A', '#D6338A', '#F4C20D', '#3BA7E0', '#1B3A6B'];
  for (var i = 0; i < 40; i++) { var p = document.createElement('i'); p.style.left = Math.random() * 100 + '%'; p.style.background = cols[i % cols.length]; p.style.animationDelay = (Math.random() * .5) + 's'; p.style.animationDuration = (1.3 + Math.random() * .8) + 's'; box.appendChild(p); }
  document.body.appendChild(box); setTimeout(function(){ box.remove(); }, 2900);
}
function thanks(msg, sub){ var o = document.querySelector('.thanks'); if (o) o.remove(); var t = document.createElement('div'); t.className = 'thanks'; t.innerHTML = '<div>'+esc(msg)+(sub ? '<small>'+esc(sub)+'</small>' : '')+'</div>'; document.body.appendChild(t); setTimeout(function(){ t.remove(); }, 3100); }
function buzz(ms){ try { if (navigator.vibrate) navigator.vibrate(ms); } catch (e) {} toTop({ rm: 'vibrate', ms: ms }); }
function findMaid(n){ var f = null; plan.workers.forEach(function(w){ w.maids.forEach(function(m){ if (m.name === n) f = m; }); }); (plan.pool || []).forEach(function(m){ if (m.name === n) f = m; }); return f; }
function floorKey(m){ var k = 99999; m.rooms.forEach(function(r){ var n = Number(r); if (n < k) k = n; }); return k; }
function doneOf(m){ return m.rooms.filter(function(r){ return checks[r]; }).length; }
function remOf(m){ return Math.max(0, m.dirty - doneOf(m)); }
function isFull(m){ return m.dirty > 0 && doneOf(m) >= m.dirty; }
function doneBy(name){ var n = 0; for (var k in checks) if (checks[k] && checks[k].worker === name) n++; return n; }
function loadOf(w){ return w.maids.reduce(function(s, m){ return s + remOf(m); }, 0); }
function wSum(w){ var d = doneBy(w.name), r = loadOf(w); return { done: d, rem: r, target: d + r }; }   // 목표 = 내가 체크한 수 + 내 담당의 남은 수
function overall(){ var d = 0, t = 0; plan.workers.forEach(function(w){ w.maids.forEach(function(m){ d += Math.min(doneOf(m), m.dirty); t += m.dirty; }); }); return { done: d, target: t }; }

// ---------- 체크: 누르는 즉시 화면 반영, 서버에는 한 건씩 차례로 (실패 시 자동 재시도)
var mine = {}, queue = [], sending = false;
function merge(srv){
  var out = {}, now = Date.now(); for (var k in (srv || {})) out[k] = srv[k];
  for (var r in mine) { var m = mine[r];
    if (now - m.t > 120000 || (!m.wait && !!out[r] === m.want)) { delete mine[r]; continue; }
    if (m.want) out[r] = out[r] || m.v; else delete out[r]; }
  return out;
}
function tap(r, maid, worker, viaAdmin){
  var want = !checks[r], v = { room: r, maid: maid, worker: worker, at: new Date().toISOString() };
  mine[r] = { want: want, v: v, t: Date.now(), wait: true };
  var c = {}; for (var k in checks) c[k] = checks[k]; if (want) c[r] = v; else delete c[r]; checks = c; render();
  for (var i = sending ? 1 : 0; i < queue.length; i++) if (queue[i].room === r) { queue[i].want = want; queue[i].worker = worker; queue[i].admin = !!viaAdmin; return; }
  queue.push({ room: r, maid: maid, worker: worker, want: want, admin: !!viaAdmin, tries: 0 }); pump();
}
function pump(){
  if (sending || !queue.length) { showQ(); return; }
  sending = true; showQ(); var j = queue[0], v = pver;
  google.script.run.withSuccessHandler(function(st){
      sending = false; queue.shift();
      if (mine[j.room] && !queue.some(function(q){ return q.room === j.room; })) mine[j.room].wait = false;
      apply(st, v); pump();
    }).withFailureHandler(function(err){
      sending = false;
      var em = String(err && err.message || '');
      if (em.indexOf('NOTMINE:') >= 0) {   // 내 담당이 아닌 객실 → 다시 시도하지 않고 되돌림
        queue.shift(); delete mine[j.room]; refresh(true); pump(); note(em.slice(em.indexOf('NOTMINE:') + 8)); return;
      }
      if (++j.tries < 4) { $('#sync').textContent = '저장 다시 시도 중… (' + queue.length + '건 남음)'; setTimeout(pump, 1500 * j.tries); return; }
      queue.shift(); delete mine[j.room]; refresh(true); pump();
      $('#sync').textContent = j.room + '호 저장에 실패했어요. 인터넷 연결을 확인하고 다시 눌러 주세요.';
    }).setCheck(plan.date, j.room, j.maid, j.worker, j.want, j.admin ? adminTok : '');
}
function showQ(){ if (sending || queue.length) $('#sync').textContent = '저장 중… (' + queue.length + '건 남음)'; else if (!busyChg) stamp(); }
var holdMsg = 0;   // 중요한 안내는 몇 초 동안 '마지막 동기화'로 덮지 않음
function stamp(){ if (Date.now() < holdMsg) return; $('#sync').textContent = '마지막 동기화 ' + hm(new Date().toISOString()); }
function note(msg){ holdMsg = Date.now() + 8000; $('#sync').textContent = msg; }
function apply(st, v){
  if (!st) return;
  if (v === undefined || v === pver) plan = st;
  checks = merge(st.checks); render();   // 열린 창은 다시 그리지 않음 (입력 중인 글자·키보드 유지)
}

// ---------- 화면
function render(){
  if (!plan) return;
  if (!plan.date) { $('#main').innerHTML = '<div class="notice"><strong>아직 배정이 없어요.</strong><br>관리자가 오늘 배정을 올리면 나타나요.</div>'; $('#tabs').innerHTML = ''; return; }
  $('#date').textContent = plan.label;
  if (plan.noPlan) {   // 오늘 더티 배분이 아직 안 올라옴 — 출근 체크는 이때도 가능
    $('#allTxt').textContent = '-'; $('#allBar').style.width = '0%';
    var wait = '<div class="notice"><strong>오늘 더티 배정은 아직 준비 중이에요.</strong>'+
      (adminTok && plan.lastDate ? '<br><br>⚠ 관리자: 오늘 배분 파일이 아직 없어요 (마지막 배분: '+esc(plan.lastDate.slice(5).replace('-', '/'))+'). 위 \'📋 더티 배분 만들기\'에서 정비보고서 엑셀로 바로 만들 수 있어요.' : '')+'</div>';
    if (adminTok) { $('#tabs').innerHTML = ''; $('#main').innerHTML = '<div class="amode"><b>관리자 모드</b><button class="ghost" data-admin-off="1">관리자 모드 끄기</button></div>' + wait + attAdminHtml(); return; }
    if (me && known(me)) { $('#tabs').innerHTML = meBar(me, false); $('#main').innerHTML = attCard(me, null) + wait; return; }
    $('#tabs').innerHTML = ''; renderPicker(); $('#main').insertAdjacentHTML('afterbegin', wait); return;
  }
  var t = overall();
  $('#allTxt').textContent = t.done + ' / ' + t.target + '실';
  $('#allBar').style.width = (t.target ? Math.min(100, t.done / t.target * 100) : 0) + '%';
  var act = active();
  if (!adminTok) {   // 근무자 모드: 이 휴대폰 주인 화면만
    var mw = me ? workerOf(me) : null;
    if (!mw && me && known(me)) { $('#tabs').innerHTML = meBar(me, false); $('#main').innerHTML = attCard(me, null) + '<div class="notice"><strong>오늘 더티 담당 명단에는 없어요.</strong><br>출근·퇴근 체크는 여기서 하시면 돼요. 더티를 맡게 되면 관리자가 추가해 줘요.</div>'; return; }
    if (!mw) { $('#tabs').innerHTML = ''; renderPicker(); return; }
    tab = me;
    $('#tabs').innerHTML = meBar(me, mw.ended, mw.color);
    var y0 = window.scrollY;
    if (mw.ended) renderEnded(mw); else renderWorker(mw);
    window.scrollTo(0, y0);
    return;
  }
  var cur = workerOf(tab);
  if (tab !== '관리자' && !cur) tab = '관리자';
  cur = workerOf(tab);
  var tabs = act.slice(); if (cur && cur.ended) tabs.push(cur);
  $('#tabs').innerHTML = tabs.map(function(w){
    return '<button class="tab" data-t="'+esc(w.name)+'" aria-selected="'+(tab === w.name)+'"><span class="dot" style="background:'+esc(w.color)+'"></span>'+esc(w.name)+(w.ended ? ' (종료)' : '')+'</button>';
  }).join('') + '<button class="tab" data-t="관리자" aria-selected="'+(tab === '관리자')+'">관리자</button>';
  var y = window.scrollY;
  if (tab === '관리자') renderAdmin(); else if (cur.ended) renderEnded(cur); else renderWorker(cur);
  window.scrollTo(0, y);
}

function meBar(n, ended, color){
  return '<div class="mebar"><span class="mechip"><span class="dot" style="background:'+esc(color || '#5D6D7E')+'"></span>'+esc(n)+' 님'+(ended ? ' (종료)' : '')+'</span><button class="mywork" data-mywork="1">내 근무</button><button class="rename" data-rename="1">이름 바꾸기</button></div>';
}
// 출퇴근 카드 (근무자 화면 맨 위)
function attCard(n, w){
  var a = attOf(n) || {};
  if (!a.in) return '<section class="att"><div class="h">오늘 출근 체크 전이에요<small>출근하면 눌러 주세요. 시각은 자동으로 기록돼요.</small></div><button class="attbtn in" data-att="in">출근하기</button></section>';
  if (a.out) return '<section class="att off"><div class="now">출근 <b>'+esc(a.in)+'</b> · 퇴근 <b>'+esc(a.out)+'</b> · 오늘도 수고하셨어요 🎉</div><div class="row"><button class="attbtn sub" data-att="unout">퇴근 취소</button></div></section>';
  return '<section class="att on"><div class="now">✅ 출근 <b>'+esc(a.in)+'</b> · 지금 하는 일 <b>'+esc(taskLab(a.task))+'</b>'+(a.memo ? ' <small style="color:var(--muted)">('+esc(a.memo)+')</small>' : '')+'</div>'+
    '<div class="row"><button class="attbtn sub" data-att="task">일 바꾸기</button><button class="attbtn out" data-att="out">퇴근하기</button></div></section>';
}
function defTask(n){ var w = workerOf(n); if (!w) return ''; if (w.maids.length) return '더티'; if (w.etc) return '기타 업무'; return ''; }
// 관리자: 오늘 출퇴근 현황
function attAdminHtml(){
  var att = plan.att || {}, names = [];
  (plan.workers || []).forEach(function(w){ if (names.indexOf(w.name) < 0) names.push(w.name); });
  Object.keys(att).forEach(function(n){ if (names.indexOf(n) < 0 && att[n].in) names.push(n); });
  if (plan.noPlan) (plan.known || []).forEach(function(n){ if (names.indexOf(n) < 0) names.push(n); });   // 배분 전: 최근 근무자도 보여서 대신 출근 입력 가능
  var inN = names.filter(function(n){ return att[n] && att[n].in; }).length;
  var noOut = names.filter(function(n){ return att[n] && att[n].in && !att[n].out; });
  var late = nowHM() >= '17:00';
  var rows = names.map(function(n){
    var a = att[n] || {};
    var right = !a.in ? '<span class="miss">미출근</span>' : esc(a.in) + ' ~ ' + (a.out ? esc(a.out) : (late ? '<span class="miss">미기록</span>' : '근무 중'));
    return '<div class="attrow"><span><b>'+esc(n)+'</b> <small>'+(a.in ? esc(taskLab(a.task))+(a.memo ? ' · '+esc(a.memo) : '') : '')+(a.fixed ? ' · 관리자 입력' : '')+'</small></span><span>'+right+'</span><button class="ghost" data-attedit="'+esc(n)+'">수정</button></div>';
  }).join('');
  return '<div class="card"><h3>오늘 출퇴근 · 출근 '+inN+' / '+names.length+'명'+(noOut.length && late ? ' <small style="color:var(--warn)">퇴근 미기록 '+noOut.length+'명</small>' : '')+'</h3>'+
    '<div class="rows">'+(rows || '<div><span style="color:var(--muted)">오늘 명단이 아직 없어요.</span></div>')+'</div>'+
    '<div class="acts" style="margin-top:10px"><button data-month="1">월 출역표 만들기</button></div></div>';
}
function roomTile(r, m, viewer){
  var c = checks[r], isNew = m.added && m.added.indexOf(r) >= 0, other = c && c.worker && c.worker !== viewer;
  var sub = c ? hm(c.at) + (other ? ' ' + c.worker : '') : (isNew ? '추가' : '');
  return '<button class="room'+(c ? ' on' : '')+(other ? ' other' : '')+(isNew ? ' new' : '')+'" data-r="'+esc(r)+'" data-m="'+esc(m.name)+'">'+esc(r)+(sub ? '<small>'+esc(sub)+'</small>' : '')+'</button>';
}
function maidCard(m, w){
  var d = doneOf(m), n = m.dirty, full = isFull(m), over = n > 0 && d > n;
  var cls = n === 0 ? 'idle' : over ? 'full over' : full ? 'full' : d > 0 ? 'prog' : 'idle';
  var style = ' style="--wc:'+esc(w.color)+'"';
  if (full && !openCards[m.name]) {   // 할당량을 채운 카드는 한 줄로 접기
    return '<section class="maid '+cls+'"'+style+'><button class="fold" data-fold="'+esc(m.name)+'"><span>✓</span><span class="nm">'+esc(m.name)+'</span><span class="floor">'+esc(m.floors)+'</span>'+
      (m.taken ? '<span class="badge">추가</span>' : '')+'<span class="r">'+(over ? '완료 +'+(d - n) : '완료')+' · '+d+'/'+n+' ▾</span></button></section>';
  }
  var big = n === 0 ? '목표 0<small>실</small>' : over ? '완료 +'+(d - n) : full ? '완료 ✓' : (n - d)+'<small>실 남음</small>';
  var h = '<section class="maid '+cls+'"'+style+'><div class="maid-head"><span class="nm">'+esc(m.name)+'</span><span class="floor">'+esc(m.floors)+'</span>'+
    (m.taken ? '<span class="badge">추가</span>' : '')+(full ? '<button class="unfold" data-fold="'+esc(m.name)+'">접기 ▴</button>' : '')+
    '<div class="stat"><span class="big">'+big+'</span><button class="qty" data-edit="'+esc(m.name)+'" title="지원 수량 수정">완료 '+d+' / 목표 '+n+' ✎</button></div></div>'+
    '<div class="pbar"><i style="width:'+(n ? Math.min(100, d / n * 100) : 0)+'%"></i></div><div class="rooms">';
  m.rooms.forEach(function(r){ h += roomTile(r, m, w.name); });
  var lastH = m.handoffs && m.handoffs.length ? m.handoffs[m.handoffs.length - 1] : null;
  var hint = (m.taken ? '가져온 담당 · ' : '') + (lastH ? lastH.from + ' 님에게서 넘겨받음 · ' : '') + '배정 객실 '+m.rooms.length+'실 중 지원한 객실을 체크';
  h += '</div><div class="maid-foot"><p class="hint">'+esc(hint)+'</p><button class="ghost" data-edit="'+esc(m.name)+'">수량·객실 수정</button>'+
    (m.taken ? '<button class="ghost" data-release="'+esc(m.name)+'"'+(busyChg ? ' disabled' : '')+'>'+(busyChg === m.name ? '되돌리는 중…' : '지원 없음으로 되돌리기')+'</button>' : '')+'</div></section>';
  return h;
}
function handedNotes(w){
  var seen = {}, out = [];
  (plan.changes || []).forEach(function(c){
    if (c.kind !== '넘겨받음' || c.from !== w.name || seen[c.maid]) return;
    var m = findMaid(c.maid); if (!m || m.worker === w.name) return;
    seen[c.maid] = 1;
    var mineN = m.rooms.filter(function(r){ return checks[r] && checks[r].worker === w.name; }).length;
    out.push(esc(m.name)+' 님 '+(mineN ? mineN+'실 완료 후 ' : '')+esc(c.worker)+' 님께 인계'+(m.worker !== c.worker ? ' (지금 '+esc(m.worker || '지원 없음')+')' : ''));
  });
  return out;
}
function renderWorker(w){
  var s = wSum(w), allDone = s.rem === 0 && s.target > 0, a = attOf(w.name) || {};
  var etcNow = !w.maids.length && (a.task === '기타 업무' || (!a.task && w.etc));
  var html = adminTok ? '' : attCard(w.name, w);
  if (etcNow) {
    html += '<div class="notice"><strong>오늘은 기타 업무예요.</strong><br>더티를 도와야 할 때는 아래에서 메이드를 가져오세요.</div>';
  } else html += '<section class="sum'+(allDone ? ' alldone' : '')+'" style="--wc:'+esc(w.color)+'"><div class="who"><b>'+esc(w.name)+'</b> 님 · 담당 메이드 '+w.maids.length+'명</div>'+
    '<div class="left">'+(allDone ? '<span class="n">완료 ✓</span>' : '<span class="u">남은 더티</span><span class="n">'+s.rem+'</span><span class="u">실</span>')+
    '<span class="of">완료 '+s.done+' / 목표 '+s.target+'</span></div><div class="meter"><i style="width:'+(s.target ? Math.min(100, s.done / s.target * 100) : 0)+'%"></i></div>'+
    '<p>마친 객실을 누르면 체크, 다시 누르면 취소돼요. 숫자(✎)를 누르면 지원 수량을 바꿀 수 있어요.</p></section>';
  var notes = handedNotes(w);
  if (notes.length) html += '<div class="handed"><div><b>넘겨준 담당</b></div>'+notes.map(function(t){ return '<div>'+t+'</div>'; }).join('')+'</div>';
  if (!w.maids.length && !etcNow) html += '<div class="notice"><strong>아직 담당 메이드가 없어요.</strong><br>아래 "다른 정비보조 담당 넘겨받기"나 "더티 지원 없음"에서 가져오세요.</div>';
  w.maids.forEach(function(m){ html += maidCard(m, w); });

  var others = [];
  active().forEach(function(o){ if (o.name !== w.name) o.maids.forEach(function(m){ if (remOf(m) > 0) others.push({ m: m, o: o }); }); });
  var openO = openSecs.others !== undefined ? openSecs.others : (!w.maids.length && !etcNow);
  html += '<details class="pool" data-sec="others"'+(openO ? ' open' : '')+'><summary>다른 정비보조 담당 넘겨받기 '+others.length+'명<span>일이 몰린 동료의 메이드를 내 담당으로 가져와요</span></summary>'+
    (others.length ? others.map(function(x){
      return '<div class="prow"><div class="who"><b>'+esc(x.m.name)+'</b><span class="floor">'+esc(x.m.floors)+'</span><p>'+esc(x.o.name)+' 담당 · 남은 '+remOf(x.m)+'실</p></div>'+
        '<button class="take" data-hand="'+esc(x.m.name)+'"'+(busyChg ? ' disabled' : '')+'>넘겨받기</button></div>';
    }).join('') : '<div class="prow"><span class="owner">넘겨받을 담당이 없어요.</span></div>')+'</details>';

  var pool = plan.pool || [];
  var openP = openSecs.pool !== undefined ? openSecs.pool : (!w.maids.length && !others.length && !etcNow);
  html += '<details class="pool" data-sec="pool"'+(openP ? ' open' : '')+'><summary>더티 지원 없음 '+pool.length+'명<span>방이 늘어 지원이 필요하면 가져오세요</span></summary>'+
    (pool.length ? pool.map(function(m){
      return '<div class="prow"><div class="who"><b>'+esc(m.name)+'</b><span class="floor">'+esc(m.floors)+'</span><p>'+esc(m.rooms.join(', '))+'</p></div>'+
        '<button class="take" data-take="'+esc(m.name)+'"'+(busyChg ? ' disabled' : '')+'>'+(busyChg === m.name ? '가져오는 중…' : '가져오기')+'</button></div>';
    }).join('') : '<div class="prow"><span class="owner">모든 메이드가 담당자에게 배정되어 있어요.</span></div>')+'</details>';
  $('#main').innerHTML = html;
}

  var s = '<b>'+esc(c.worker)+'</b> · '+esc(c.maid)+' 님 ';

  if (c.kind === '가져옴') s += '담당으로 가져옴' + (hasN ? ' (지원 '+c.dirty+'실)' : '');

// ---------- 자동 나누기
// 인원 추가: 남은 더티가 많은 사람 → 적은 사람으로, 아직 손대지 않은 메이드부터, 받는 사람 층과 가까운(처음이면 높은 층부터 이어지는) 메이드를 옮김
function balancePlan(){
  var ws = dActive(); if (ws.length < 2) return [];
  var L = {}, owned = {}, moved = {}, total = 0, moves = [];
  ws.forEach(function(w){ L[w.name] = loadOf(w); owned[w.name] = w.maids.slice(); total += L[w.name]; });
  var avg = total / ws.length;
  function center(name){ var a = owned[name]; if (!a.length) return null; return a.reduce(function(s, m){ return s + floorKey(m); }, 0) / a.length; }
  for (var guard = 0; guard < 200; guard++) {
    var recv = ws.slice().sort(function(a, b){ return L[a.name] - L[b.name]; })[0].name;
    if (avg - L[recv] < 0.5) break;
    var donors = ws.filter(function(w){ return w.name !== recv && L[w.name] - avg >= 0.5; }).sort(function(a, b){ return L[b.name] - L[a.name]; });
    var found = false, c = center(recv);
    for (var i = 0; i < donors.length && !found; i++) {
      var dn = donors[i].name;
      var cands = owned[dn].filter(function(m){ return !moved[m.name] && remOf(m) > 0; }).sort(function(a, b){
        var ta = doneOf(a) > 0 ? 1 : 0, tb = doneOf(b) > 0 ? 1 : 0; if (ta !== tb) return ta - tb;
        return c === null ? floorKey(b) - floorKey(a) : Math.abs(floorKey(a) - c) - Math.abs(floorKey(b) - c);
      });
      for (var j = 0; j < cands.length; j++) {
        var m = cands[j], x = remOf(m);
        var before = Math.abs(L[dn] - avg) + Math.abs(L[recv] - avg), after = Math.abs(L[dn] - x - avg) + Math.abs(L[recv] + x - avg);
        if (after < before - 0.01) {
          L[dn] -= x; L[recv] += x; moved[m.name] = 1;
          owned[dn].splice(owned[dn].indexOf(m), 1); owned[recv].push(m);
          moves.push({ maid: m.name, from: m.worker, to: recv, rem: x, floors: m.floors });
          found = true; break;
        }
      }
    }
    if (!found) break;
  }
  return moves;
}
// 근무 종료: 그 사람 담당 전부를 층 순서대로 묶어서, 남은 더티가 적은 사람부터 고르게 채움 (또는 한 사람에게 모두)
function endPlan(name, mode, target){
  var X = workerOf(name); if (!X) return [];
  var list = X.maids.slice().sort(function(a, b){ return floorKey(a) - floorKey(b); });
  if (mode === 'one') return list.map(function(m){ return { maid: m.name, from: name, to: target, rem: remOf(m), floors: m.floors }; });
  var recv = dActive().filter(function(w){ return w.name !== name; });
  if (!recv.length) return [];
  var L = {}, total = 0; recv.forEach(function(w){ L[w.name] = loadOf(w); total += L[w.name]; });
  list.forEach(function(m){ total += remOf(m); });
  var avg = total / recv.length, order = recv.slice().sort(function(a, b){ return L[a.name] - L[b.name]; }), k = 0;
  return list.map(function(m){
    while (k < order.length - 1 && L[order[k].name] >= avg - 0.5) k++;
    var to = order[k].name; L[to] += remOf(m);
    return { maid: m.name, from: name, to: to, rem: remOf(m), floors: m.floors };
  });
}
function planHtml(moves, removing){
  var before = {}, after = {}, byTo = {};
  dActive().forEach(function(w){ before[w.name] = loadOf(w); after[w.name] = before[w.name]; });
  moves.forEach(function(mv){ if (before[mv.from] === undefined) { before[mv.from] = loadOf(workerOf(mv.from)); after[mv.from] = before[mv.from]; } if (before[mv.to] === undefined) { before[mv.to] = 0; after[mv.to] = 0; } });
  moves.forEach(function(mv){ after[mv.from] -= mv.rem; after[mv.to] += mv.rem; (byTo[mv.to] = byTo[mv.to] || []).push(mv); });
  var rows = dActive().filter(function(w){ return w.name !== removing; }).map(function(w){
    var list = byTo[w.name] || [];
    return '<div><b>'+esc(w.name)+'</b> 남은 '+before[w.name]+'실 → <b>'+after[w.name]+'실</b>'+
      (list.length ? '<div class="mv">받음: '+list.map(function(mv){ return esc(mv.maid)+'('+esc(mv.floors)+' · '+mv.rem+'실)'; }).join(', ')+'</div>' : '')+'</div>';
  });
  return '<div class="plan">'+rows.join('')+'</div>';
}

// ---------- 서버 호출 (담당 변경)
function call(fn, args, key, ok){
  if (busyChg) return;
  busyChg = key || true; if (dlg) { dlg.err = ''; drawDlg(); } render(); note('담당 변경 저장 중…');
  var runner = google.script.run.withSuccessHandler(function(st){
      busyChg = false; dlg = null; pver++; apply(st); drawDlg(); showQ();
      if (ok) ok(st);
    }).withFailureHandler(function(err){
      busyChg = false; var msg = (err && err.message || '저장하지 못했어요').replace(/^(Exception|Error):\s*/, '');
      if (msg.indexOf('관리자 비밀번호가 필요') >= 0) { adminTok = null; lsSet('dust_admin', null); }
      if (dlg) { dlg.err = msg; drawDlg(); } render(); refresh(true); note(msg);
    });
  runner[fn].apply(runner, args);
}
function act(kind, name, rooms, n, del){
  call('change', [plan.date, kind, name, tab, rooms || '', n === undefined ? '' : n, (del || []).join(',')], name);
}

    var r = dlg.room, mm = dlg.maidOfRoom; dlg = null; drawDlg(); tap(r, mm, tab);

        busyChg = false; adminTok = tok; lsSet('dust_admin', tok); dlg = null; drawDlg(); tab = '관리자'; lsSet('dust_tab', tab); render(); window.scrollTo(0, 0); stamp();
      }, function(err){
        busyChg = false; if (dlg) { dlg.err = String(err && err.message || '확인하지 못했어요').replace(/^(Exception|Error):\s*/, ''); dlg.pin = ''; drawDlg(); var f = $('#pin'); if (f) f.focus(); }

    });
  } else if (k === 'split') {
    var mv = dlg.moves;
    call('moveMaids', [plan.date, mv.map(function(x){ return { maid: x.maid, from: x.from, to: x.to }; }), '', adminTok], 'split', function(st){
      note(st.skipped && st.skipped.length ? '그 사이 바뀐 '+st.skipped.length+'명은 빼고 나눴어요.' : '남은 더티를 나눴어요.');
    });

  } else if (k === 'attout') {

<script>
(function(){
  try {
    if (typeof render !== 'function' || typeof drawDlg !== 'function') return;   // 정비 지원 화면이 없으면 아무것도 안 함
    var ac = null, acBusy = false, timer = null;
    var MEMOS = ['얼룩', '교체 필요', '파손', '오염', '수리 필요'];
    function acRun(fn, args, ok, fail){
      acBusy = true;
      var r = google.script.run.withSuccessHandler(function(x){ acBusy = false; ok(x); })
        .withFailureHandler(function(e){ acBusy = false; var m = String(e && e.message || e).replace(/^(Exception|Error):\s*/, '').replace('NOTMINE:', ''); if (fail) fail(m); else if (ac) { ac.err = m; draw(); } });
      r[fn].apply(r, args);
    }
    function who(){ return adminTok ? '' : me; }
    // ---------- 버튼 넣기
    var prevRender = render, prevDraw = drawDlg;
    render = function(){ prevRender.apply(this, arguments); try { put(); } catch (e) {} };
    drawDlg = function(){
      if (dlg && dlg.kind === 'act') { try { draw(); } catch (e) { $('#sheet').innerHTML = ''; } return; }
      if (ac) stop();
      return prevDraw.apply(this, arguments);
    };
    function put(){
      var bar = document.querySelector('#tabs .mebar');
      if (bar && me && !adminTok && !bar.querySelector('.ac-open')) bar.insertAdjacentHTML('beforeend', '<button class="mywork ac-open" data-ac="open">🗺 활동판</button>');
      var am = document.querySelector('#main .amode');
      if (am && adminTok && !am.querySelector('.ac-open')) am.insertAdjacentHTML('beforeend', '<button class="ghost ac-open" data-ac="open">🗺 객실 활동판</button>');
    }
    function stop(){ ac = null; if (timer) { clearInterval(timer); timer = null; } }
    // ---------- 열기
    function open(){
      dlg = { kind: 'act' }; ac = { stage: 'load', err: '', mode: 'done', pend: {}, queue: [] }; draw();
      acRun('actList', [adminTok || ''], function(d){
        ac.list = d; ac.rooms = d.rooms; ac.colors = d.colors; ac.icolors = d.itemColors || {}; ac.imax = d.itemMax || 5;
        var live = d.acts.filter(function(a){ return a.status === '진행'; });
        if (!adminTok && live.length === 1) openAct(live[0].id); else { ac.stage = 'list'; draw(); }
      }, function(m){ ac.stage = 'list'; ac.err = m; ac.list = { acts: [] }; draw(); });
      if (timer) clearInterval(timer);
      timer = setInterval(function(){ if (document.visibilityState === 'visible' && ac && ac.stage === 'map' && !ac.queue.length && !acBusy && !ac.ask) reload(); }, 2500);
    }
    function openAct(id){
      ac.stage = 'map'; ac.cur = null; ac.err = ''; ac.pend = {}; ac.full = false; draw();
      acRun('actGet', [id, adminTok || ''], function(d){
        ac.cur = d; var k = 'ac_floor_' + d.id, f = Number(lsGet(k) || 0);
        ac.floor = floors().indexOf(f) >= 0 ? f : firstOpenFloor(); try { lsSet('ac_last', d.id); } catch (e) {}
        draw();
      }, function(m){ ac.stage = 'list'; ac.err = m; draw(); });
    }
    function reload(){ if (!ac || !ac.cur) return; var id = ac.cur.id; google.script.run.withSuccessHandler(function(d){ if (ac && ac.cur && ac.cur.id === id && !ac.queue.length) { ac.cur = d; draw(); } }).actGet(id, adminTok || ''); }
    // ---------- 도면 도구
    function allFloors(){ var s = {}; (ac.rooms || []).forEach(function(r){ s[Math.floor(Number(r) / 100)] = 1; }); return Object.keys(s).map(Number).sort(function(a, b){ return b - a; }); }
    // 대상 구간 확대 (11/8): 대상 객실이 있는 층·호수 범위만 보여 줌. 범위가 전체의 70% 넘으면 그대로. '전체 도면 보기'(ac.full)로 전환
    function view(){
      var c = ac.cur; if (!c) return { crop: false };
      if (c._v && c._v.k === c.excl.join(',')) return c._v;
      var ex = {}; c.excl.forEach(function(r){ ex[r] = 1; });
      var t = (ac.rooms || []).filter(function(r){ return !ex[r]; }), v = { k: c.excl.join(','), crop: false };
      if (t.length) {
        var ls = t.map(function(r){ return Number(r) % 100; }), fs = t.map(function(r){ return Math.floor(Number(r) / 100); });
        v.l0 = Math.min.apply(null, ls); v.l1 = Math.max.apply(null, ls); v.f0 = Math.min.apply(null, fs); v.f1 = Math.max.apply(null, fs);
        v.crop = (v.l1 - v.l0 + 1) * (v.f1 - v.f0 + 1) <= 0.7 * 17 * 28;
      }
      c._v = v; return v;
    }
    function zoomed(){ return !ac.full && view().crop; }
    function floors(){ var v = view(); return allFloors().filter(function(f){ return !zoomed() || (f >= v.f0 && f <= v.f1); }); }
    function roomsOf(f){ var v = view(), z = zoomed(); return (ac.rooms || []).filter(function(r){ var l = Number(r) % 100; return Math.floor(Number(r) / 100) === f && (!z || (l >= v.l0 && l <= v.l1)); }); }
    function markOf(r){ var p = ac.pend[r]; if (p) return p.s === '취소' ? null : p; return ac.cur && ac.cur.marks[r] || null; }
    function isEx(r){ return ac.cur && ac.cur.excl.indexOf(r) >= 0; }
    function firstOpenFloor(){ var fs = floors(); for (var i = 0; i < fs.length; i++) if (roomsOf(fs[i]).some(function(r){ return !isEx(r) && !markOf(r); })) return fs[i]; return fs[0]; }
    function stats(){   // 서버 숫자 + 아직 저장 중인 체크까지 반영

      its().forEach(function(i){ bi[i.k] = 0; });
      (ac.rooms || []).forEach(function(r){ if (isEx(r)) return; t++; var m = markOf(r); if (m) { if (m.s === '이상') { is++; (m.t || []).forEach(function(k){ if (k in bi) bi[k]++; }); } else d++; } });
      return { target: t, done: d, issue: is, proc: d + is, pct: t ? Math.round((d + is) / t * 1000) / 10 : 0, items: bi };
    }

        }).actMark(id, j.r, j.s, j.memo, who(), adminTok || '', j.t || []);
    }
    // ---------- 입력
    document.addEventListener('input', function(e){ if (ac && ac.ask && e.target.id === 'ac-memo') ac.ask.memo = e.target.value; if (ac && e.target.id === 'ac-excl') { var su = document.getElementById('ac-exsum'); if (su) su.textContent = exSum(e.target.value); } });
    document.addEventListener('change', function(e){ if (ac && ac.stage === 'form' && e.target.getAttribute && e.target.getAttribute('data-it')) { syncForm(); draw(); } });
    document.addEventListener('click', function(e){
      var b = e.target.closest && e.target.closest('[data-ac]'); if (!b || b.disabled) return;
      var k = b.getAttribute('data-ac'), v = b.getAttribute('data-v'), id = b.getAttribute('data-id');
      if (k === 'open') { open(); return; }
      if (!ac) return;
      if (ac.stage === 'form') syncForm();
      if (k === 'list') { ac.stage = 'list'; ac.cur = null; ac.err = ''; ac.f = null; draw(); acRun('actList', [adminTok || ''], function(d){ ac.list = d; draw(); }); return; }
      if (k === 'act') { openAct(id); return; }
      if (k === 'mode') { ac.mode = v; ac.err = ''; draw(); return; }
      if (k === 'arch' && adminTok) { ac.stage = 'arch'; ac.arch = null; ac.err = ''; ac.jump = true; draw(); acRun('actArchived', [adminTok], function(d){ ac.arch = d; draw(); }, function(m){ ac.err = m; ac.arch = { acts: [] }; draw(); }); return; }
      if (k === 'full') { ac.full = !ac.full; var fs2 = floors(); if (fs2.indexOf(ac.floor) < 0) ac.floor = firstOpenFloor(); draw(); return; }
      if (k === 'fl' && v) { ac.floor = Number(v); ac.err = ''; try { lsSet('ac_floor_' + ac.cur.id, v); } catch (e2) {} draw(); var t = document.querySelector('.ac-fh'); if (t && b.classList.contains('ac-row')) t.scrollIntoView({ block: 'start', behavior: 'smooth' }); return; }
      if (k === 'room') {
        if (!ac.cur || ac.cur.status !== '진행') return;
        var r = b.getAttribute('data-r'), m = markOf(r); ac.err = '';
        var lk = locked(r, m); if (lk) { ac.ask = { room: r, kind: 'lock', day: kday(m.at), why: lk }; try { buzz(60); } catch (e4) {} draw(); return; }
        if (ac.mode === 'issue' || (m && m.s === '이상')) { ac.ask = { room: r, memo: m && m.s === '이상' ? m.memo : '', t: tagsOf(m) }; draw(); return; }
        if (m && !adminTok && m.w && m.w !== who()) { ac.ask = { room: r, kind: 'other', w: m.w }; draw(); return; }   // 오늘 다른 분이 체크한 칸은 한 번 더 묻기
        mark(r, m ? '취소' : '완료', ''); return;
      }
      if (k === 'memo' && ac.ask) { ac.ask.memo = v; draw(); return; }
      if (k === 'tg' && ac.ask) { var tl = ac.ask.t = ac.ask.t || [], ti = tl.indexOf(v); if (ti >= 0) tl.splice(ti, 1); else tl.push(v); ac.ask.err = ''; try { buzz(15); } catch (e5) {} draw(); return; }
      if (k === 'issave' && ac.ask) {
        var mi = document.getElementById('ac-memo'), r2 = ac.ask.room, raw = String(mi ? mi.value : ac.ask.memo || '').trim();
        if (its().length) { var tt = (ac.ask.t || []).slice(); if (!tt.length && !raw) { ac.ask.err = '해당하는 항목을 하나 이상 골라 주세요. 해당 없으면 아래 \''+doneOf(ac.cur)+'(으)로\'를 눌러 주세요.'; draw(); return; } ac.ask = null; mark(r2, '이상', raw, tt); return; }
        ac.ask = null; mark(r2, '이상', raw || '이상'); return;
      }
      if (k === 'todone' && ac.ask) { var r3 = ac.ask.room; ac.ask = null; mark(r3, '완료', ''); return; }
      if (k === 'unmark' && ac.ask) { var r4 = ac.ask.room; ac.ask = null; mark(r4, '취소', ''); return; }
      if (k === 'askx') { ac.ask = null; draw(); return; }
      if (!adminTok || acBusy) return;
      // 관리자
      if (k === 'new') { var td = (ac.list && ac.list.today) || ''; ac.f = { id: '', name: '', color: '민트', start: td, due: '', excl: '', memo: '', items: [], doneName: '' }; ac.stage = 'form'; ac.err = ''; ac.jump = true; draw(); return; }
      if (k === 'edit') { var a = ac.list.acts.filter(function(x){ return x.id === id; })[0]; if (!a) return; ac.f = { id: a.id, name: a.name, color: a.color, start: a.start, due: a.due, excl: a.exclText || '', memo: a.memo, doneName: a.doneName || '', items: (a.items || []).map(function(i){ return { k: i.k, n: i.n, c: i.c }; }) }; ac.stage = 'form'; ac.err = ''; ac.jump = true; draw(); return; }
      if (k === 'color' && ac.f) { ac.f.color = v; draw(); return; }
      if (k === 'pick' && ac.f) { pkOpen(); return; }
      if (k === 'pickx' && ac.pk) { ac.pk = null; ac.stage = 'form'; ac.jump = true; draw(); return; }
      if (k === 'pkmode' && ac.pk) { ac.pk.mode = v; draw(); return; }
      if (k === 'pkall' && ac.pk) { ac.pk.set = {}; ac.pk.warn = ''; draw(); return; }
      if (k === 'pkreset' && ac.pk) { var o = {}; ac.pk.orig.forEach(function(r){ o[r] = 1; }); ac.pk.set = o; ac.pk.warn = ''; draw(); return; }
      if (k === 'pkline' && ac.pk) { var ln = Number(v); pkGroup(function(r){ return Number(r) % 100 === ln; }); return; }
      if (k === 'pkfloor' && ac.pk) { var fn = Number(v); pkGroup(function(r){ return Math.floor(Number(r) / 100) === fn; }); return; }
      if (k === 'pkdone' && ac.pk) {
        var P = ac.pk, now = Object.keys(P.set), was = {}; P.orig.forEach(function(r){ was[r] = 1; });
        var hit = now.filter(function(r){ return !was[r] && P.marks[r]; }).sort();
        if (hit.length && !P.warn) { P.warn = '이미 체크된 ' + hit.length + '실(' + hit.slice(0, 6).join('·') + (hit.length > 6 ? ' …' : '') + ')이 제외돼요. 기록은 지워지지 않고 진도율에서만 빠져요. 다시 대상으로 돌리면 기록도 그대로 돌아와요.'; draw(); return; }
        ac.f.excl = actExcl.compact(now); ac.pk = null; ac.stage = 'form'; ac.jump = true; draw(); return;
      }
      if (k === 'itadd' && ac.f) { var used = (ac.f.items || []).map(function(i){ return i.c; }), pick = Object.keys(ac.icolors || {}).filter(function(c){ return used.indexOf(c) < 0; })[0] || '빨강'; ac.f.items.push({ k: '', n: '', c: pick }); draw(); var ni = document.getElementById('ac-it-n-' + (ac.f.items.length - 1)); if (ni) ni.focus(); return; }
      if (k === 'itdel' && ac.f) { ac.f.items.splice(Number(v), 1); draw(); return; }
      if (k === 'save' && ac.f) {
        if (!String(ac.f.name).trim()) { ac.err = '활동 이름을 적어 주세요.'; draw(); return; }
        ac.err = ''; draw();
        acRun('actSave', [adminTok, ac.f], function(d){ ac.list = d; ac.stage = 'list'; ac.f = null; ac.jump = true; draw(); try { note('활동을 저장했어요'); } catch (e3) {} }, function(m){ ac.err = m; draw(); });
        return;
      }
      if (k === 'lock') {
        var lkind = b.getAttribute('data-k');
        if (lkind === '잠그기' && (ac.askId !== id || ac.askKind !== '잠그기')) { ac.askId = id; ac.askKind = '잠그기'; draw(); return; }   // 두 번 눌러야
        ac.askId = ''; ac.askKind = '';
        acRun('actStatus', [adminTok, id, lkind], function(d){ ac.cur = d; draw(); try { note(lkind === '잠그기' ? '지금까지 체크된 칸을 잠갔어요' : '잠금을 풀었어요'); } catch (e6) {} }, function(m2){ ac.err = m2; draw(); });
        return;
      }
      if (k === 'st') {
        var kind = b.getAttribute('data-k');
        if (kind !== '다시 열기' && kind !== '꺼내기' && (ac.askId !== id || ac.askKind !== kind)) { ac.askId = id; ac.askKind = kind; draw(); return; }   // 끝내기·보관·삭제는 두 번 눌러야
        ac.askId = ''; ac.askKind = ''; ac.err = '';
        var inArch = kind === '꺼내기' || kind === '삭제';
        acRun('actStatus', [adminTok, id, kind], function(d){ if (inArch) { ac.arch = d; try { note(kind === '삭제' ? '활동을 지웠어요' : '목록으로 꺼냈어요 (끝난 활동)'); } catch (e7) {} } else ac.list = d; draw(); }, function(m){ ac.err = m; draw(); });
      }
    });
    put();
  } catch (e) { try { console.warn('활동판을 붙이지 못했어요', e); } catch (e2) {} }
})();

<script>
/* 정비보조 명단 (2026-11-08): 관리자 화면 '👥 정비보조 명단' — 새 이름 넣기 · 그만둔 분 빼기 (sup_meta/roster). 이름 고르기·출근·활동판·더티 배분 칩에 같이 쓰임 */
(function(){
  try {
    if (typeof render !== 'function' || !window.SupShim || !SupShim.roster) return;
    var R = null;
    var prev = render;
    render = function(){ prev.apply(this, arguments); try { put(); } catch (e) {} };
    function put(){
      var am = document.querySelector('#main .amode');
      if (am && adminTok && !am.querySelector('.rs-open')) am.insertAdjacentHTML('beforeend', '<button class="ghost rs-open" data-rs="open">👥 정비보조 명단</button>');
    }
    function box(){ var b = document.getElementById('rs-pop'); if (!b) { b = document.createElement('div'); b.id = 'rs-pop'; document.body.appendChild(b); } return b; }
    function draw(){
      var b = box(); if (!R) { b.innerHTML = ''; return; }
      var names = SupShim.roster.names(), recent = SupShim.roster.recent();
      var rows = names.map(function(n){
        var mine = R.add.indexOf(n) >= 0 && recent.indexOf(n) < 0;
        return '<div><span><b>'+esc(n)+'</b>'+(mine ? ' <span style="color:var(--muted);font-size:12px">· 직접 넣음</span>' : '')+'</span><button class="ghost" data-rs="hide" data-n="'+esc(n)+'">빼기</button></div>';
      }).join('');
      var hid = R.hide.map(function(n){ return '<div><span style="color:var(--muted)">'+esc(n)+'</span><button class="ghost" data-rs="unhide" data-n="'+esc(n)+'">되살리기</button></div>'; }).join('');
      b.innerHTML = '<div class="ac-pop"><div class="pn" style="max-height:88vh;overflow:auto"><h3>👥 정비보조 명단 '+names.length+'명</h3>'+
        '<p class="ac-note" style="margin:0;font-size:14px">이름 고르기·출근 체크·활동판·더티 배분에 나오는 이름이에요. 최근 45일 근무한 분은 자동으로 들어와요.</p>'+
        '<div style="display:flex;gap:8px"><input class="ac-in" id="rs-new" maxlength="20" placeholder="새 이름 (예: 홍길동)" value="'+esc(R.typed || '')+'"><button class="ac-big" style="width:auto;padding:0 18px" data-rs="add">추가</button></div>'+
        (R.err ? '<p class="ac-err" style="margin:0">'+esc(R.err)+'</p>' : '')+
        '<div class="ac-list">'+(rows || '<p class="ac-note">아직 이름이 없어요.</p>')+'</div>'+
        (hid ? '<div class="ac-sub" style="margin-top:6px">뺀 이름 <span style="font-weight:600;color:var(--muted);font-size:12px">그만둔 분 — 목록에 안 나와요</span></div><div class="ac-list">'+hid+'</div>' : '')+
        '<button class="ac-big" style="background:var(--surface);color:var(--ink);border:1.5px solid var(--line)" data-rs="close">닫기</button></div></div>';
    }
    function save(){
      SupShim.roster.save(R.add, R.hide).then(null, function(e){ if (R) { R.err = '저장 못 함: ' + (e && (e.code || e.message) || e); draw(); } });
      try { render(); } catch (e) {}
      draw();
    }
    function clean(v){ return String(v || '').replace(/\s+/g, ' ').trim().slice(0, 20); }
    document.addEventListener('input', function(e){ if (R && e.target.id === 'rs-new') R.typed = e.target.value; });
    document.addEventListener('keydown', function(e){ if (R && e.target.id === 'rs-new' && e.key === 'Enter') { e.preventDefault(); var x = document.querySelector('[data-rs="add"]'); if (x) x.click(); } });
    document.addEventListener('click', function(e){
      var t = e.target.closest && e.target.closest('[data-rs]'); if (!t) return;
      var k = t.getAttribute('data-rs'), n = t.getAttribute('data-n');
      if (k === 'open') { var g = SupShim.roster.get(); R = { add: g.add, hide: g.hide, typed: '', err: '' }; draw(); return; }
      if (!R) return;
      if (k === 'close') { R = null; draw(); return; }
      R.err = '';
      if (k === 'add') {
        var nm = clean((document.getElementById('rs-new') || {}).value || R.typed);
        if (!nm) { R.err = '이름을 적어 주세요.'; draw(); return; }
        if (nm === '관리자') { R.err = "'관리자'는 이름으로 쓸 수 없어요."; draw(); return; }
        if (SupShim.roster.names().indexOf(nm) >= 0) { R.err = nm + ' 님은 이미 명단에 있어요.'; draw(); return; }
        R.hide = R.hide.filter(function(x){ return x !== nm; });
        if (R.add.indexOf(nm) < 0) R.add.push(nm);
        R.typed = ''; try { note(nm + ' 님을 명단에 넣었어요'); } catch (e2) {}
        save(); return;
      }
      if (k === 'hide' && n) { if (R.hide.indexOf(n) < 0) R.hide.push(n); R.add = R.add.filter(function(x){ return x !== n; }); save(); return; }
      if (k === 'unhide' && n) { R.hide = R.hide.filter(function(x){ return x !== n; }); if (SupShim.roster.recent().indexOf(n) < 0 && R.add.indexOf(n) < 0) R.add.push(n); save(); return; }
    });
    put();
  } catch (e) { try { console.warn('정비보조 명단을 붙이지 못했어요', e); } catch (e2) {} }
})();
</script>
